<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Khalil Shakra — Backend Developer</title>
  <meta name="description" content="Portfolio of Khalil Shakra — Backend Developer with a focus on Cloud. C#, .NET, Azure, Docker, Kubernetes and secure, scalable APIs." />

  <!-- Fonts: Poppins (bold display) + JetBrains Mono (technical / body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== NAVBAR ===== -->
  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a href="#home" class="brand" aria-label="Home">
        <span class="brand-name" id="brandName">Khalil Shakra</span>
      </a>

      <nav class="nav-links" id="navLinks" aria-label="Primary">
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="nav-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme" title="Toggle theme">
          <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="6.9" y2="6.9"/><line x1="17.1" y1="17.1" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="6.9" y2="17.1"/><line x1="17.1" y1="6.9" x2="18.8" y2="5.2"/></g></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20 14.5A8 8 0 0 1 9.5 4a0.5 0.5 0 0 0-.7-.6A9 9 0 1 0 20.6 15.2a0.5 0.5 0 0 0-.6-.7z"/></svg>
        </button>
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== HERO ===== -->
    <section class="hero container" id="home">
      <div class="hero-left">
        <h1 class="hero-name" id="heroName"></h1>
        <p class="hero-subtitle" id="heroSubtitle"></p>
        <div class="hero-socials" id="heroSocials"></div>
        <p class="hero-tagline" id="heroTagline"></p>
        <div class="hero-cta" id="heroCTA"></div>
      </div>

      <div class="hero-right">
        <div class="avatar-wrap">
          <div class="avatar-bg" aria-hidden="true"></div>
          <img class="avatar" id="heroImg" src="assets/profile.jpg" alt="Portrait of Khalil Shakra" width="600" height="600" fetchpriority="high" />
        </div>
      </div>
    </section>

    <!-- ===== PROJECTS ===== -->
    <section class="section container" id="projects">
      <h2 class="section-title" id="projectsHeading">Projects</h2>
      <p class="section-sub" id="projectsSub"></p>
      <div class="proj-grid" id="projectsGrid"></div>
    </section>

    <!-- ===== SKILLS ===== -->
    <section class="section container" id="skills">
      <h2 class="section-title" id="skillsHeading">Skills</h2>
      <p class="section-sub" id="skillsSub"></p>
      <div class="skill-rows" id="skillsGrid"></div>
    </section>

    <!-- ===== CONTACT ===== -->
    <section class="section container" id="contact">
      <h2 class="section-title" id="contactHeading">Contact</h2>
      <p class="section-sub" id="contactSub"></p>
      <form class="cform" id="contactForm" novalidate>
        <input id="cfName" name="name" type="text" placeholder="Name" required autocomplete="name" />
        <input id="cfEmail" name="email" type="email" placeholder="Email" required autocomplete="email" />
        <textarea id="cfMsg" name="message" rows="5" placeholder="Message" required></textarea>
        <button type="submit" class="btn btn-primary btn-block">Submit</button>
        <p class="form-note" id="formNote" role="status" aria-live="polite"></p>
      </form>
      <div class="contact-links" id="contactActions"></div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container">
      <span id="footerText"></span>
    </div>
  </footer>

  <div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
